document:
  dsl: "0.0.1"
  namespace: default
  name: raise-rethrow
  version: "0.0.1"

do:
  - callUpstream:
      try:
        - fetch:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        as: error
        do:
          - rethrow:
              if: ${ $error.status != 404 }
              raise:
                error: "${ $error }"
          - notFound:
              raise:
                error:
                  type: https://example.invalid/errors/not-found
                  status: 404
                  title: Upstream resource missing
                  detail: ${ "status=" + ($error.status | tostring) }
