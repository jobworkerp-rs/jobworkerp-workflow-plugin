document:
  dsl: "0.0.1"
  namespace: default
  name: call-http-secrets
  version: "0.0.1"

use:
  secrets:
    - github-token
  authentications:
    github:
      bearer:
        use: github-token
do:
  - getRepo:
      call: http
      with:
        method: get
        endpoint:
          uri: https://api.github.com/repos/jobworkerp-rs/jobworkerp-rs
          authentication:
            use: github
        headers:
          Accept: application/vnd.github+json
        output: response
      output:
        as:
          status: ${.statusCode}
          stars: ${.body.stargazers_count}
  - postWithInlineToken:
      call: http
      with:
        method: post
        endpoint:
          uri: https://api.example.com/items
          authentication:
            bearer:
              token: ${ $secrets["github-token"] }
        body:
          name: ${.stars | tostring}
