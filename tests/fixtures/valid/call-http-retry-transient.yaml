document:
  dsl: "0.0.1"
  namespace: default
  name: call-http-retry-transient
  version: "0.0.1"

do:
  - fetchData:
      try:
        - get:
            call: http
            with:
              method: get
              endpoint: https://api.example.com/data
      catch:
        errors:
          with:
            type: https://open-workflow-specification.org/spec/1.0.0/errors/communication
        as: apiError
        when: ${ $apiError.status >= 500 or $apiError.status == 429 }
        retry:
          delay:
            seconds: 5
          backoff:
            exponential: {}
          limit:
            attempt:
              count: 3
        do:
          - fallback:
              set:
                result: cached
                errorDetail: ${ $apiError.detail }
