document:
  dsl: "0.0.1"
  namespace: default
  name: run-runner-command-context-secret-stdin
  version: "0.0.1"

do:
  - useToken:
      run:
        runner:
          name: COMMAND
          arguments:
            command: sh
            args: ["-c", "read -r token && test -n \"$token\""]
            stdin: ${ $_secrets.token }
            treatNonzeroAsError: true
